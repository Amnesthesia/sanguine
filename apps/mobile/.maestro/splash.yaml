appId: ${APP_ID}
name: Brand splash - lock-up, rule and one of six taglines fade in, then hand over (D-049)
---
- runFlow:
    file: _open.yaml
    env:
      LINK: ${LINKBASE}dev/seed?scenario=typical
- extendedWaitUntil:
    visible:
      id: screen-today
    timeout: 90000
# a warm relaunch shows the native splash, then the JS continuation
- launchApp
- extendedWaitUntil:
    visible:
      id: brand-splash
    timeout: 30000
- takeScreenshot: splash-fade
- assertVisible: "(Blood demands blood\\.|The River of Blood never empties.*|By blood bound, by brass crowned\\.|Offerings of bone, rivers of red\\.|The earth drinks deep.*|An ocean of red for the Lord of Rage\\.)"
- takeScreenshot: splash-tagline
- extendedWaitUntil:
    notVisible:
      id: brand-splash
    timeout: 15000
- assertVisible:
    id: screen-today
