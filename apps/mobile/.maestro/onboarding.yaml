appId: ${APP_ID}
name: Onboarding, five steps (adult, with last period and life state)
---
- runFlow:
    file: _open.yaml
    env:
      LINK: ${LINKBASE}
- extendedWaitUntil:
    visible:
      id: screen-onboarding
    timeout: 90000
- assertVisible: "Track and understand your cycle"
- takeScreenshot: step1-purpose
- tapOn:
    id: onboarding-continue
# step 2: age is required
- assertVisible: "How old are you?"
# the date-of-birth selector starts thirty years back; ten years earlier makes it forty
- assertVisible:
    id: birth-date
- tapOn:
    id: birth-date-year-down10
- takeScreenshot: step2-age
- tapOn:
    id: onboarding-continue
# step 3: last period
- assertVisible: "When did your last period start?"
- tapOn:
    id: last-yesterday
- takeScreenshot: step3-last-period
- tapOn:
    id: onboarding-continue
# step 4: life state
- assertVisible: "Anything that affects your cycle right now?"
- tapOn:
    id: life-postHormonal
- scrollUntilVisible:
    element: "When did you stop?"
- takeScreenshot: step4-life-state
- tapOn:
    id: onboarding-continue
# step 5: privacy
- assertVisible: "Your data stays with you"
- takeScreenshot: step5-privacy
- tapOn:
    id: health-offer
- assertVisible:
    id: health-note
- tapOn:
    id: consent
- runFlow:
    when:
      visible:
        id: consent-explicit
    commands:
      - tapOn:
          id: consent-explicit
- tapOn:
    id: onboarding-continue
# the Health offer opens Health sync once the setup is finished
- extendedWaitUntil:
    visible:
      id: screen-health
    timeout: 20000
- tapOn:
    id: back
- extendedWaitUntil:
    visible:
      id: screen-today
    timeout: 20000
