appId: ${APP_ID}
name: App shell - four tabs
---
- runFlow:
    file: _open.yaml
    env:
      LINK: ${APP_URL}/--/dev/seed?scenario=typical
- extendedWaitUntil:
    visible:
      id: screen-today
    timeout: 90000
- takeScreenshot: today
- tapOn: Calendar
- assertVisible:
    id: screen-calendar
- tapOn: Insights
- assertVisible:
    id: screen-insights
- tapOn: Settings
- assertVisible:
    id: screen-settings
- tapOn: Today
- assertVisible:
    id: screen-today
