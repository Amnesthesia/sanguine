appId: ${APP_ID}
name: Onboarding age gate (minimum 13) and teen note
---
- runFlow:
    file: _open.yaml
    env:
      LINK: ${LINKBASE}
- extendedWaitUntil:
    visible:
      id: screen-onboarding
    timeout: 90000
- tapOn:
    id: onboarding-continue
# the selector starts thirty years back: two jumps of ten years later make the user ten
- repeat:
    times: 2
    commands:
      - tapOn:
          id: birth-date-year-up10
- assertVisible: "Sanguine is for people aged 13 and over."
- takeScreenshot: step2-too-young
- tapOn:
    id: onboarding-continue
- assertVisible: "How old are you?"
# five years earlier makes the user fifteen: teen mode, no error
- repeat:
    times: 5
    commands:
      - tapOn:
          id: birth-date-year-down
- assertNotVisible: "Sanguine is for people aged 13 and over."
- assertVisible:
    id: teen-note
- takeScreenshot: step2-teen
- tapOn:
    id: onboarding-continue
- assertVisible: "When did your last period start?"
