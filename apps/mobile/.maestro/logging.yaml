appId: ${APP_ID}
name: Logging sheet - two-tap period, two-tap symptom, temperature, correction
---
- runFlow:
    file: _open.yaml
    env:
      LINK: ${LINKBASE}dev/seed?scenario=empty
- extendedWaitUntil:
    visible:
      id: screen-today
    timeout: 90000
- evalScript: ${output.today = (function(){var d=new Date();var p=function(n){return (n<10?'0':'')+n};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());})()}

# period start: Log today (tap 1), flow level (tap 2); Done closes the sheet and Today updates (D-097)
- assertVisible: "Log your period to start"
- tapOn:
    id: quick-log
- extendedWaitUntil:
    visible:
      id: flow-medium
    timeout: 10000
- takeScreenshot: sheet-period
- tapOn:
    id: flow-medium
- runFlow: _close-sheet.yaml
- extendedWaitUntil:
    visible:
      id: screen-today
    timeout: 10000
- assertVisible: "Day 1 of your period"
- assertVisible: "Logged: medium flow"
- takeScreenshot: today-after-period

# symptom: Log today (tap 1), tile (tap 2) is mild, tile again is moderate (D-097)
- tapOn:
    id: quick-log
- extendedWaitUntil:
    visible:
      id: symptom-cramps
    timeout: 10000
- tapOn:
    id: symptom-cramps
- assertVisible: "Cramps, mild, 1 of 3"
- tapOn:
    id: symptom-cramps
- assertVisible: "Cramps, moderate, 2 of 3"
- scrollUntilVisible:
    element:
      id: energy-2
    centerElement: true
- tapOn:
    id: energy-2
- assertVisible:
    id: energy-2
    checked: true
- tapOn:
    id: energy-2
- assertVisible:
    id: energy-2
    checked: false
- tapOn:
    id: energy-4
- takeScreenshot: energy-logged
- takeScreenshot: sheet-symptoms
- runFlow: _close-sheet.yaml

# it persisted
- tapOn:
    id: quick-log
- extendedWaitUntil:
    visible:
      id: symptom-cramps
    timeout: 10000
- assertVisible: "Cramps, moderate, 2 of 3"

# temperature
- tapOn:
    id: more-temperature
- tapOn:
    id: temp-value
- inputText: "36.5"
- pressKey: Enter
- assertVisible: ".*36.50 °C.*"
- runFlow: _close-sheet.yaml

# day detail: see everything, delete one entry
- openLink: ${LINKBASE}day/${output.today}
- extendedWaitUntil:
    visible:
      id: screen-day
    timeout: 20000
- assertVisible: "Medium flow"
- assertVisible: "Cramps 2/3"
- assertVisible: "Temperature 36.50 °C.*"
- takeScreenshot: day-detail
- tapOn:
    id: event-delete-symptom
# deleting asks first (D-075); Cancel keeps the entry, Delete removes it
- assertVisible: "Delete this entry\\?"
- tapOn: "Cancel"
- assertVisible: "Cramps 2/3"
- tapOn:
    id: event-delete-symptom
- assertVisible: "Delete this entry\\?"
- tapOn: "Delete entry"
- assertNotVisible: "Cramps 2/3"
- assertVisible: "Medium flow"

# P3-9 (D-052): a day 4 days before a period asks "Is it the same period?"; same joins, new splits
- evalScript: ${output.minus4 = (function(){var d=new Date(Date.now()-4*86400000);var p=function(n){return (n<10?'0':'')+n};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());})()}
- openLink: ${LINKBASE}log?day=${output.minus4}&section=period
- extendedWaitUntil:
    visible:
      id: flow-light
    timeout: 20000
- tapOn:
    id: flow-light
- extendedWaitUntil:
    visible: ".*Is it the same period\\?"
    timeout: 10000
- takeScreenshot: join-prompt
- tapOn: "Same period"
# the period sheet closes itself after the answer
- openLink: ${LINKBASE}today
- extendedWaitUntil:
    visible: "Day 5 of your period"
    timeout: 20000
- takeScreenshot: today-joined
- openLink: ${LINKBASE}log?day=${output.minus4}&section=period
- extendedWaitUntil:
    visible:
      id: flow-light
    timeout: 20000
- tapOn:
    id: flow-light
- tapOn:
    id: flow-light
- extendedWaitUntil:
    visible: ".*Is it the same period\\?"
    timeout: 10000
- tapOn: "A new period"
# the period sheet closes itself after the answer
- openLink: ${LINKBASE}today
- extendedWaitUntil:
    visible: "Day 1 of your period"
    timeout: 20000
- takeScreenshot: today-split
