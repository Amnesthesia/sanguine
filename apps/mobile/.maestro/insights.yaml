appId: ${APP_ID}
name: Insights - history, charts, accuracy, long-cycle prompt, cycle detail
---
- runFlow:
    file: _open.yaml
    env:
      LINK: ${LINKBASE}dev/seed?scenario=typical
- extendedWaitUntil:
    visible:
      id: screen-today
    timeout: 90000
- tapOn: Insights
- extendedWaitUntil:
    visible:
      id: screen-insights
    timeout: 10000
- assertVisible: ".*29 days.*"
- assertVisible: ".*28 days.*"
- assertVisible: ".*ovulation: calendar.*"
# the row is one button whose label reads the whole row (D-093), so match inside it
- assertVisible: ".*current.*"
- takeScreenshot: history
- tapOn: "Charts"
- assertVisible: "Cycle length"
# two typical cycles are one line segment, not a trend: the chart waits for a third (D-093)
- assertVisible:
    id: chart-length-few
- assertVisible: "The chart appears after three typical cycles."
- takeScreenshot: charts-few
- tapOn: "Accuracy"
- assertVisible: "Your 80% ranges have contained the actual date .* of 2 times."
- assertVisible: "Average miss: .* days"
- takeScreenshot: accuracy
# a probable missed log is offered for correction
- runFlow:
    file: _open.yaml
    env:
      LINK: ${LINKBASE}dev/seed?scenario=skippedLog
- extendedWaitUntil:
    visible:
      id: screen-today
    timeout: 90000
- tapOn: Insights
- extendedWaitUntil:
    visible:
      id: screen-insights
    timeout: 10000
# five typical cycles: the length chart is drawn (D-093)
- tapOn: "Charts"
- assertVisible:
    id: chart-length
- assertVisible: "Shaded: where the next cycle is likely to fall \\(80%\\)."
- takeScreenshot: charts
- tapOn: "History"
- scrollUntilVisible:
    element: ".*unusually long.*"
- scrollUntilVisible:
    element:
      id: was-pregnant
- assertVisible:
    id: missed-log
- takeScreenshot: missed-log
- assertVisible:
    id: was-pregnant
# centred: at the bottom edge the button counts as visible but sits under the floating tab bar, and the tap opens Calendar
- scrollUntilVisible:
    element:
      id: confirm-long
    centerElement: true
- tapOn:
    id: confirm-long
- assertNotVisible: ".*unusually long.*"
# cycle detail and excluding a cycle
- scrollUntilVisible:
    element:
      id: cycle-detail-link
    direction: UP
- tapOn:
    id: cycle-detail-link
# on Android a tap that lands while the list is still settling after the confirm above is dropped: tap again
- runFlow:
    when:
      notVisible:
        id: screen-cycle
    commands:
      - tapOn:
          id: cycle-detail-link
- extendedWaitUntil:
    visible:
      id: screen-cycle
    timeout: 10000
- assertVisible: "Status: typical"
# at the bottom edge the button sits under the floating tab bar and the tap opens Calendar (as D-094); centre it first
- scrollUntilVisible:
    element:
      id: cycle-exclude
    centerElement: true
- tapOn:
    id: cycle-exclude
- assertVisible: "Status: excluded"
- assertVisible: "This cycle is left out of your estimates."
- takeScreenshot: cycle-detail
# P3-12 (D-053): an unusually long cycle can be marked as a pregnancy; it is then paused, not a possible missed log
- runFlow:
    file: _open.yaml
    env:
      LINK: ${LINKBASE}dev/seed?scenario=skippedLog
- extendedWaitUntil:
    visible:
      id: screen-today
    timeout: 90000
- tapOn: Insights
- extendedWaitUntil:
    visible:
      id: screen-insights
    timeout: 10000
- scrollUntilVisible:
    element:
      id: was-pregnant
- tapOn:
    id: was-pregnant
- extendedWaitUntil:
    visible: "How did the pregnancy end\\?"
    timeout: 10000
- takeScreenshot: pregnancy-outcome
- tapOn: "Pregnancy loss"
- extendedWaitUntil:
    notVisible: ".*unusually long.*"
    timeout: 10000
- scrollUntilVisible:
    element: ".*paused period.*"
- takeScreenshot: marked-pregnancy
