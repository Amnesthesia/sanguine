appId: ${APP_ID}
name: Settings - appearance, tracking options, life state, backup recovery code, about, delete everything
---
- runFlow:
    file: _open.yaml
    env:
      LINK: ${LINKBASE}dev/seed?scenario=typical
- extendedWaitUntil:
    visible:
      id: screen-today
    timeout: 90000
- tapOn: Settings
- extendedWaitUntil:
    visible:
      id: screen-settings
    timeout: 10000
- takeScreenshot: index
# appearance
- tapOn:
    id: settings-appearance
- tapOn:
    id: theme-dark
- takeScreenshot: appearance-dark
- tapOn:
    id: back
- tapOn:
    id: settings-appearance
- tapOn:
    id: theme-light
- tapOn:
    id: back
# tracking options: sexual-activity logging is off until turned on
- tapOn:
    id: settings-tracking
- scrollUntilVisible:
    element:
      id: track-sex
    timeout: 90000
    speed: 70
- tapOn:
    id: track-sex
- tapOn:
    id: back
# life state: pregnant pauses the estimates
- tapOn:
    id: settings-life
- tapOn:
    id: life-pregnant
- assertVisible: "Estimates are paused while this is set. Your logs are kept."
- tapOn:
    id: life-apply
- scrollUntilVisible:
    element:
      id: life-saved
- takeScreenshot: lifestate
- tapOn:
    id: back
- tapOn: Today
- assertVisible: "Estimates are paused while “Pregnant” is set."
- takeScreenshot: today-paused
# P3-12 (D-053): ending a pregnancy with a loss
- tapOn: Settings
- tapOn:
    id: settings-life
- assertVisible:
    id: pregnancy-ended-hint
- scrollUntilVisible:
    element:
      id: life-afterLoss
- tapOn:
    id: life-afterLoss
- assertVisible: "Estimates use general starting ranges for your first three cycles."
- scrollUntilVisible:
    element:
      id: life-apply
- tapOn:
    id: life-apply
- scrollUntilVisible:
    element:
      id: life-saved
- takeScreenshot: lifestate-after-loss
- tapOn:
    id: back
# about
- tapOn: Settings
- tapOn:
    id: settings-about
- assertVisible:
    id: about-band
- assertVisible:
    id: about-tagline
- assertVisible: "Estimate engine .*"
- assertVisible: "Engine hash .*"
# the version row checks for an over-the-air update; the dev client has updates off, so the toast says so (D-103)
- assertVisible: "Version .*Tap to check for updates.*"
- tapOn:
    id: about-version
- assertVisible:
    id: toast
- takeScreenshot: about-update-toast
- assertVisible: "Sanguine does not diagnose, screen for or treat any condition. If you are worried about your health, talk to a health professional."
- takeScreenshot: about
# the published privacy policy, bundled (D-072)
- scrollUntilVisible:
    element:
      id: about-privacy-policy
- tapOn:
    id: about-privacy-policy
- assertVisible:
    id: screen-legal
- assertVisible: "Sanguine Privacy Policy"
- scrollUntilVisible:
    element:
      text: ".*admin@dothings.lol.*"
- takeScreenshot: privacy-policy
- tapOn:
    id: back
- tapOn:
    id: back
