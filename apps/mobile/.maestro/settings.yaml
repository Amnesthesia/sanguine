appId: ${APP_ID}
name: Settings - appearance, tracking options, life state, backup recovery code, about, delete everything
---
- runFlow:
    file: _open.yaml
    env:
      LINK: ${LINKBASE}dev/seed?scenario=typical
- extendedWaitUntil:
    visible:
      id: screen-today
    timeout: 90000
- tapOn: Settings
- extendedWaitUntil:
    visible:
      id: screen-settings
    timeout: 10000
- takeScreenshot: index
# appearance
- tapOn:
    id: settings-appearance
- tapOn:
    id: theme-dark
- takeScreenshot: appearance-dark
- tapOn:
    id: back
- tapOn:
    id: settings-appearance
- tapOn:
    id: theme-light
- tapOn:
    id: back
# tracking options: sexual-activity logging is off until turned on
- tapOn:
    id: settings-tracking
- scrollUntilVisible:
    element:
      id: track-sex
- tapOn:
    id: track-sex
- tapOn:
    id: back
# life state: pregnant pauses the estimates
- tapOn:
    id: settings-life
- tapOn:
    id: life-pregnant
- assertVisible: "Estimates are paused while this is set. Your logs are kept."
- tapOn:
    id: life-apply
- assertVisible:
    id: life-saved
- takeScreenshot: lifestate
- tapOn:
    id: back
- tapOn: Today
- assertVisible: "Estimates are paused while “Pregnant” is set."
- takeScreenshot: today-paused
# about
- tapOn: Settings
- tapOn:
    id: settings-about
- assertVisible:
    id: about-band
- assertVisible: "Estimate engine .*"
- assertVisible: "Engine hash .*"
- assertVisible: "Sanguine does not diagnose, screen for or treat any condition. If you are worried about your health, talk to a health professional."
- takeScreenshot: about
- tapOn:
    id: back
