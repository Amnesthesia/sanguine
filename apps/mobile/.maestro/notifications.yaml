appId: ${APP_ID}
name: Notifications - discreet by default, reminder scheduled from the prediction
---
- runFlow:
    file: _open.yaml
    env:
      LINK: ${LINKBASE}dev/seed?scenario=typical
- extendedWaitUntil:
    visible:
      id: screen-today
    timeout: 90000
- tapOn: Settings
- tapOn:
    id: settings-notifications
- assertVisible: "Sanguine: a reminder"
- takeScreenshot: default
- runFlow:
    when:
      true: ${!(PLATFORM == 'android' && CLIENT == 'expogo')}
    commands:
      - tapOn:
          id: notif-period
      - tapOn:
          text: "Allow"
          optional: true
      - extendedWaitUntil:
          visible:
            id: notif-next
          timeout: 15000
      - assertVisible: "Next reminder: .*"
      - takeScreenshot: scheduled
# Android in Expo Go cannot load expo-notifications (SDK 53+): the switch is disabled with an explanation until the dev client
- runFlow:
    when:
      true: ${PLATFORM == 'android' && CLIENT == 'expogo'}
    commands:
      - assertVisible: "Reminders on Android arrive in a later update."
      - takeScreenshot: android-later
- tapOn:
    id: notif-descriptive
- assertVisible: "Sanguine: Period likely in .*"
- takeScreenshot: descriptive
