appId: ${APP_ID}
name: Notifications - discreet text, default reminder rules, add and remove a rule, late-period switch (D-090)
---
- runFlow:
    file: _open.yaml
    env:
      LINK: ${LINKBASE}dev/seed?scenario=typical
- extendedWaitUntil:
    visible:
      id: screen-today
    timeout: 90000
- tapOn: Settings
- tapOn:
    id: settings-notifications
- assertVisible:
    id: rule-ovulation-3
- assertVisible:
    id: rule-period-3
- assertVisible:
    id: rule-period-1
- assertVisible:
    id: notif-late
- takeScreenshot: default
- runFlow:
    when:
      true: ${!(PLATFORM == 'android' && CLIENT == 'expogo')}
    commands:
      # on by default; switching off and on again asks for permission on a fresh install
      - tapOn:
          id: notif-enabled
      - tapOn:
          id: notif-enabled
      - tapOn:
          text: "Allow"
          optional: true
      - extendedWaitUntil:
          visible: "Next reminder: .*"
          timeout: 15000
      - takeScreenshot: scheduled
- runFlow:
    when:
      true: ${PLATFORM == 'android' && CLIENT == 'expogo'}
    commands:
      - assertVisible: "Reminders on Android arrive in a later update."
- scrollUntilVisible:
    element:
      id: rule-add
- tapOn:
    id: rule-days-7
- tapOn:
    id: rule-event-fertile
- tapOn:
    id: rule-add
- scrollUntilVisible:
    element:
      id: rule-fertile-7
    direction: UP
- assertVisible: "7 days before the fertile window estimate"
- takeScreenshot: added
- tapOn:
    id: rule-remove-fertile-7
- assertNotVisible:
    id: rule-fertile-7
- scrollUntilVisible:
    element:
      id: notif-preview
- assertVisible: "Sanguine: a reminder"
- scrollUntilVisible:
    element:
      id: notif-descriptive
    direction: UP
- tapOn:
    id: notif-descriptive
- scrollUntilVisible:
    element:
      id: notif-preview
- assertVisible: "Sanguine: Ovulation estimate: likely in .*"
- takeScreenshot: descriptive
