# Shared start: fresh Expo Go data, open the dev server, dismiss Expo Go's first-run developer-menu sheet (Android) if it appears.
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- openLink: ${APP_URL}
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: "This is the developer menu.*"
          timeout: 90000
          optional: true
      - runFlow:
          when:
            visible: "This is the developer menu.*"
          commands:
            - tapOn:
                text: "Continue"
                index: 0
            - pressKey: back
