appId: ${APP_ID}
name: Today screen states (sample-data scenarios from PLAN.md §9.6)
---
# first launch, nothing logged
- runFlow:
    file: _open.yaml
    env:
      LINK: ${LINKBASE}dev/seed?scenario=empty
- extendedWaitUntil:
    visible:
      id: screen-today
    timeout: 90000
- assertVisible: "Log your period to start"
- assertVisible: "Estimates are ranges, not promises. Not a contraceptive."
- assertNotVisible:
    id: estimate-card
- waitForAnimationToEnd
- assertNotVisible:
    id: guidance-card
- takeScreenshot: empty
# typical user, cycle day 11
- runFlow:
    file: _open.yaml
    env:
      LINK: ${LINKBASE}dev/seed?scenario=typical
- extendedWaitUntil:
    visible:
      id: screen-today
    timeout: 90000
- assertVisible:
    id: phase-ring
- assertVisible:
    id: headline-card
- assertVisible: "Period likely in .* days"
- assertVisible: ".*[Mm]ost likely .*"
- assertVisible: "fair estimate"
- assertVisible:
    id: estimate-card
- assertVisible: ".*This is for understanding your cycle. Do not use it to prevent pregnancy."
- assertNotVisible:
    id: symptom-note
- assertVisible: "Estimates are ranges, not promises. Not a contraceptive."
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: guidance-card
    centerElement: true
- assertVisible: "Food and movement"
- assertVisible:
    id: guidance-phase-follicular
- assertVisible:
    id: guidance-food-vitaminC
- assertVisible: ".*For example: muesli with kiwifruit.*"
- scrollUntilVisible:
    element:
      id: guidance-move
    centerElement: true
- assertNotVisible:
    id: guidance-supps
- takeScreenshot: guidance-today
- scrollUntilVisible:
    element:
      id: guidance-more
    centerElement: true
- tapOn:
    id: guidance-more
- extendedWaitUntil:
    visible:
      id: screen-day
    timeout: 10000
- scrollUntilVisible:
    element:
      id: guidance-sources
    centerElement: true
- assertVisible:
    id: guidance-body
- assertVisible: "Sources: .*"
- takeScreenshot: guidance-day-full
- tapOn:
    id: day-back
- takeScreenshot: typical
# period in progress
- runFlow:
    file: _open.yaml
    env:
      LINK: ${LINKBASE}dev/seed?scenario=inProgress
- extendedWaitUntil:
    visible:
      id: screen-today
    timeout: 90000
- assertVisible: "Day 2 of your period"
- assertVisible: "Logged: medium flow"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: guidance-card
    centerElement: true
- assertVisible:
    id: guidance-phase-menstrual
- assertVisible:
    id: guidance-food-iron
- scrollUntilVisible:
    element:
      id: guidance-supps
    centerElement: true
- assertVisible:
    id: guidance-supp-ginger
- assertVisible:
    id: guidance-supp-omega3
- assertVisible:
    id: guidance-supp-zinc
- takeScreenshot: guidance-period-supps
- takeScreenshot: period-in-progress
# irregular user: rough estimate and the quiet flag card
- runFlow:
    file: _open.yaml
    env:
      LINK: ${LINKBASE}dev/seed?scenario=irregular
- extendedWaitUntil:
    visible:
      id: screen-today
    timeout: 90000
- assertVisible: ".*[Mm]ost likely .*"
- assertVisible: "rough estimate"
- scrollUntilVisible:
    element:
      id: flag-variability
- assertVisible: "Your cycle lengths have varied by more than 7 days.*"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: guidance-card
    centerElement: true
- assertVisible:
    id: guidance-phase-general
- takeScreenshot: irregular-flag
# centred: at the bottom edge the button counts as visible but sits under the floating tab bar, and the tap opens Calendar
- scrollUntilVisible:
    element:
      id: flag-variability-mute
    centerElement: true
- tapOn:
    id: flag-variability-mute
- assertNotVisible:
    id: flag-variability
# dark theme
- runFlow:
    file: _open.yaml
    env:
      LINK: ${LINKBASE}dev/seed?scenario=typical&theme=dark
- extendedWaitUntil:
    visible:
      id: screen-today
    timeout: 90000
- waitForAnimationToEnd
- takeScreenshot: typical-dark
# look-back symptom note (P8-11)
- runFlow:
    file: _open.yaml
    env:
      LINK: ${LINKBASE}dev/seed?scenario=lookback
- extendedWaitUntil:
    visible:
      id: screen-today
    timeout: 90000
- assertVisible:
    id: symptom-note
- assertVisible: "In 3 of your last 4 cycles you logged cramps around this day."
- assertVisible: "From your own logs. It does not change any estimate."
- assertNotVisible: ".*mood low.*"
- assertNotVisible: ".*headache.*"
- waitForAnimationToEnd
- takeScreenshot: lookback
