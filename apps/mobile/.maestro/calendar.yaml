appId: ${APP_ID}
name: Calendar - month grid, marks, glass day card and day sheet, month list, back-dating
---
- runFlow:
    file: _open.yaml
    env:
      LINK: ${LINKBASE}dev/seed?scenario=typical
- extendedWaitUntil:
    visible:
      id: screen-today
    timeout: 90000
- evalScript: |
    ${(function(){
      var p=function(n){return (n<10?'0':'')+n};
      var f=function(d){return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())};
      var t=new Date(); var y=new Date(t.getTime()-86400000); var n=new Date(t.getTime()+86400000);
      var q=new Date(t.getFullYear(), t.getMonth()-1, 15);
      output.today=f(t); output.yesterday=f(y); output.prev15=f(q); output.tomorrow=f(n);
    })()}
- tapOn: Calendar
- extendedWaitUntil:
    visible:
      id: screen-calendar
    timeout: 10000
- assertVisible:
    id: cal-title
- assertVisible:
    id: cal-grid
# today is selected: the glass day card (the sheet's closed detent) says cycle day 11 and lists the temperature logged today
- assertVisible:
    id: day-card-open
    text: ".*Day 11.*Temperature.*"
# each cell carries its cycle day as a small number above the circle and says it to VoiceOver (D-101, P8-20)
- assertVisible:
    id: day-${output.today}
    text: ".*, cycle day 11,.*"
# the period logged 10 days ago is solid, and a predicted range is a dashed ring; solid means logged, dashed means estimate
- assertVisible: ".*, period.*"
- assertVisible: ".*predicted period, 80% range.*"
- assertVisible: ".*likelihood of being in the fertile window.*"
- assertVisible: "Fertile window likelihood"
- assertVisible: "darker = more likely to be in the fertile window"
# the legend names symptoms and other logs, and says what solid and dashed mean
- assertVisible: "Symptoms"
- assertVisible: "Other log"
- assertVisible:
    id: cal-legend-rule
- takeScreenshot: month
# the round Log button sits on the day card, the one filled control; a future day has none, and a caption says why
- assertVisible:
    id: day-log
- tapOn:
    id: day-${output.tomorrow}
- assertNotVisible:
    id: day-log
- assertVisible:
    id: cal-future-note
# a future day says what is estimated for it, never "Nothing logged" (D-104)
- assertVisible:
    id: day-card-open
    text: ".*(Fertile window: |Ovulation estimate |Period likely to start |Period possible: |No estimate covers this day).*"
- assertNotVisible: ".*Nothing logged.*"
# a predicted period day spells out the range and its confidence on the card and on the day screen
- tapOn:
    text: ".*predicted period, 80% range.*"
    index: 0
- assertVisible:
    id: day-card-open
    text: ".*Period likely to start .* · (confident|fair estimate|rough estimate).*"
- takeScreenshot: future-predicted
# tapping the selected day opens the day sheet at its small detent; Details opens the day screen
- tapOn:
    id: day-card-open
- assertVisible:
    id: day-sheet
- assertVisible:
    id: sheet-expand
- takeScreenshot: sheet-small
- tapOn:
    id: day-details
- extendedWaitUntil:
    visible:
      id: screen-day
    timeout: 10000
- assertVisible: "Estimates for this day"
- assertVisible: "Period likely to start .* · (confident|fair estimate|rough estimate)"
- assertNotVisible: "Nothing logged for this day."
- assertNotVisible:
    id: day-edit
- takeScreenshot: day-future-predicted
# a predicted period day: the full card, marked expected (P8-18)
- scrollUntilVisible:
    element:
      id: guidance-phase-menstrual
    centerElement: true
- assertVisible: "Period · expected"
- scrollUntilVisible:
    element:
      id: guidance-body
    centerElement: true
- assertVisible:
    id: guidance-body
- scrollUntilVisible:
    element:
      id: guidance-supp-ginger
    centerElement: true
- assertVisible: ".*Trials used 750 to 2,000 mg of ginger powder a day.*"
- scrollUntilVisible:
    element:
      id: guidance-sources
    centerElement: true
- takeScreenshot: day-future-guidance
# the card sits above the future-day note, so the note needs a scroll (P8-18)
- scrollUntilVisible:
    element:
      id: day-future-note
    centerElement: true
- assertVisible:
    id: day-future-note
- tapOn:
    id: day-back
- extendedWaitUntil:
    visible:
      id: screen-calendar
    timeout: 10000
# the predicted day may sit in next month's grid; the title goes back to this month and today
- tapOn:
    id: cal-title-button
- tapOn:
    id: day-${output.today}
- assertVisible:
    id: day-log
# swipe the grid sideways between months (D-092); Today and the title return to this month
- swipe:
    from:
      id: cal-grid
    direction: LEFT
- assertVisible:
    id: cal-today
- takeScreenshot: swiped-next
- tapOn:
    id: cal-today
# the pill is always there (it is the frame's toolbar); back on this month today's cycle-day number shows again
- assertVisible:
    id: cycle-day-${output.today}
- assertVisible:
    id: day-sheet
- swipe:
    from:
      id: cal-grid
    direction: RIGHT
- assertVisible:
    id: cal-today
- tapOn:
    id: cal-title-button
- assertVisible:
    id: cycle-day-${output.today}
# tap yesterday: the open sheet updates in place, with its logged entries as chips (each has an X)
- tapOn:
    id: day-${output.yesterday}
- assertVisible:
    id: day-sheet
- assertVisible: "Bloating.*"
- assertVisible:
    text: "Remove: Bloating.*"
# dragging up (or Show details) opens the large detent: estimates with their pictures, then food and movement
- tapOn:
    id: sheet-expand
- extendedWaitUntil:
    visible:
      id: estimate-sections
    timeout: 10000
- takeScreenshot: sheet-large-estimates
- scrollUntilVisible:
    element:
      id: guidance-sections
    centerElement: true
- takeScreenshot: sheet-large-guidance
- tapOn:
    id: sheet-scrim
- assertVisible:
    id: day-sheet
- tapOn:
    id: day-details
- extendedWaitUntil:
    visible:
      id: screen-day
    timeout: 10000
- assertVisible: "Bloating 2/3"
- tapOn:
    id: day-back
- extendedWaitUntil:
    visible:
      id: screen-calendar
    timeout: 10000
# back-date a period in the previous month
- tapOn:
    id: cal-prev
- tapOn:
    id: day-${output.prev15}
- tapOn:
    id: day-log
- extendedWaitUntil:
    visible:
      id: flow-medium
    timeout: 10000
- tapOn:
    id: flow-medium
- runFlow: _close-sheet.yaml
- extendedWaitUntil:
    visible:
      id: screen-calendar
    timeout: 10000
- assertVisible: ".*Medium flow.*"
- takeScreenshot: backdated
# the month list under the grid spells out what was logged and estimated; a row selects its day
- scrollUntilVisible:
    element:
      id: month-list
    centerElement: true
- takeScreenshot: month-list
- tapOn:
    id: month-row-logged-${output.prev15}
- assertVisible:
    id: day-card-open
    text: ".*Medium flow.*"
# the X on a chip removes the entry and the toast offers Undo
- tapOn:
    id: day-card-open
- tapOn:
    text: "Remove: .*flow.*"
- assertVisible: "Removed: .*"
- tapOn: "Undo"
- assertVisible: ".*Medium flow.*"
# irregular cycles: the ovulation estimate is uncertain, so the grid draws no band and the legend names none (D-098, D-106);
# a day inside the wide range says so in words (its range runs from 4 days before today to 14 after)
- runFlow:
    file: _open.yaml
    env:
      LINK: ${LINKBASE}dev/seed?scenario=irregular
- extendedWaitUntil:
    visible:
      id: screen-today
    timeout: 90000
- tapOn: Calendar
- extendedWaitUntil:
    visible:
      id: screen-calendar
    timeout: 10000
- assertVisible:
    id: cal-uncertain
- assertNotVisible: "Fertile window likelihood"
- assertNotVisible:
    id: cal-fertile-caption
- assertVisible:
    id: day-card-open
    text: ".*Ovulation estimate uncertain: could fall .* · rough estimate.*"
- takeScreenshot: uncertain
