appId: ${APP_ID}
name: Calendar - food and movement sections in the day sheet's large detent (P8-18, P8-22)
---
- runFlow:
    file: _open.yaml
    env:
      LINK: ${LINKBASE}dev/seed?scenario=typical
- extendedWaitUntil:
    visible:
      id: screen-today
    timeout: 90000
- tapOn: Calendar
- extendedWaitUntil:
    visible:
      id: screen-calendar
    timeout: 10000
# the summary card is gone: food and movement live in the day sheet, behind Show details
- assertNotVisible:
    id: guidance-summary
# today is cycle day 11 (follicular): tap the day card to open the sheet, then Show details for the large detent
- tapOn:
    id: day-card-open
- tapOn:
    id: sheet-expand
- extendedWaitUntil:
    visible:
      id: guidance-sections
    timeout: 10000
- scrollUntilVisible:
    element:
      id: guidance-phase-follicular
    centerElement: true
- assertVisible: "Follicular phase · estimate"
- takeScreenshot: calendar-guidance-sheet
# the notes carry their reasons, evidence grades and sources, as on the day screen
- scrollUntilVisible:
    element:
      id: guidance-body
    centerElement: true
- scrollUntilVisible:
    element:
      id: guidance-sources
    centerElement: true
- assertVisible: "Sources.*"
- takeScreenshot: calendar-guidance-sources
# the scrim returns to the small detent
- tapOn:
    id: sheet-scrim
- assertVisible:
    id: day-sheet
