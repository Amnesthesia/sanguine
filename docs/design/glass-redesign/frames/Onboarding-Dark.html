<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onboarding step 2, dark: age 14, teen note</title>
<style>
body{margin:0}
a{color:#BC4560}a:hover{color:#A3354F}
</style>
</head>
<body>


<div style="width: 390px; height: 844px; position: relative; box-sizing: border-box; background: #000000; color: #F4EEEF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif; overflow: hidden">
  <!-- content layer: opaque -->
  <main style="padding: 84px 24px 140px 24px; display: flex; flex-direction: column; gap: 16px">
    <h1 id="q" style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 700; color: #F4EEEF">How old are you?</h1>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 6px 6px 6px 20px; box-sizing: border-box; border-radius: 28px; background: #1C1C1E">
        <label for="dob" style="flex: 1; font-size: 17px; line-height: 22px; color: #F4EEEF">Date of birth</label>
        <button id="dob" type="button" aria-haspopup="dialog" aria-describedby="dob-help" style="min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #3A3A3C; background: #2C2C2E; color: #F4EEEF; font-size: 17px; font-family: inherit; font-variant-numeric: tabular-nums; flex-shrink: 0">14 Mar 2012</button>
      </div>
      
      <p id="dob-help" style="margin: 0; font-size: 13px; line-height: 18px; color: #B3A8AC">Your age sets the starting ranges for estimates. Your date of birth stays on this phone.</p>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="menarche" style="font-size: 13px; line-height: 18px; color: #B3A8AC">Year of first period (optional)</label>
      <input id="menarche" type="text" inputmode="numeric" maxlength="4" value="2024" style="height: 52px; box-sizing: border-box; border-radius: 26px; padding: 0 20px; border: 1.5px solid transparent; background: #1C1C1E; color: #F4EEEF; font-size: 17px; font-family: inherit; font-variant-numeric: tabular-nums">
      
    </div>
    <p style="margin: 0; display: flex; gap: 10px; padding: 12px 14px; border-radius: 18px; background: #1C1C1E; font-size: 14px; line-height: 20px; color: #F4EEEF"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><circle cx="8" cy="8" r="6.8" fill="none" stroke="#B3A8AC" stroke-width="1.5"></circle><path d="M8 7.2V11.6M8 4.6V4.8" stroke="#B3A8AC" stroke-width="1.7" stroke-linecap="round"></path></svg><span>Some features are hidden by default for under 18s. You can change this in Settings.</span></p>
  </main>

  <!-- navigation layer: Back and Skip as floating glass controls, the progress dots on a small glass platter (D-095). No tab bar during onboarding. -->
  <header style="position: absolute; top: 10px; left: 10px; right: 10px; height: 44px; display: flex; align-items: center">
    <div style="width: 80px; display: flex; justify-content: flex-start"><button type="button" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: linear-gradient(180deg, rgba(70,62,66,0.55) 0%, rgba(30,26,28,0.38) 42%, rgba(40,35,38,0.45) 100%); backdrop-filter: blur(18px) saturate(180%); -webkit-backdrop-filter: blur(18px) saturate(180%); border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 8px 22px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.10); color: #F4EEEF; font-size: 22px; padding: 0">‹</button></div>
    <div style="flex: 1; display: flex; justify-content: center">
      <div role="img" aria-label="Step 2 of 5" style="height: 30px; padding: 0 12px; border-radius: 15px; background: linear-gradient(180deg, rgba(70,62,66,0.55) 0%, rgba(30,26,28,0.38) 42%, rgba(40,35,38,0.45) 100%); backdrop-filter: blur(18px) saturate(180%); -webkit-backdrop-filter: blur(18px) saturate(180%); border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 8px 22px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.10); display: flex; align-items: center; gap: 7px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #D4607A"></span><span style="width: 22px; height: 8px; border-radius: 4px; background: #D4607A"></span><span style="width: 8px; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.28)"></span><span style="width: 8px; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.28)"></span><span style="width: 8px; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.28)"></span></div>
    </div>
    <div style="width: 80px; display: flex; justify-content: flex-end"></div>
  </header>

  <!-- navigation layer: floating glass footer with the one filled primary -->
  <div style="position: absolute; left: 10px; right: 10px; bottom: 12px; border-radius: 34px; padding: 8px; background: linear-gradient(180deg, rgba(70,62,66,0.55) 0%, rgba(30,26,28,0.38) 42%, rgba(40,35,38,0.45) 100%); backdrop-filter: blur(18px) saturate(180%); -webkit-backdrop-filter: blur(18px) saturate(180%); border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 14px 36px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.10); display: flex; flex-direction: column; gap: 6px">
    <button type="button" style="min-height: 52px; border-radius: 26px; border: 0; background: #BB546B; color: #FFFFFF; box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 6px 16px rgba(0,0,0,0.4); font-size: 17px; font-weight: 600; font-family: inherit">Continue</button>
  </div>
</div>

</body>
</html>
