<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onboarding step 3: last period, another date</title>
<style>
body{margin:0}
a{color:#BC4560}a:hover{color:#A3354F}
</style>
</head>
<body>


<div style="width: 390px; height: 844px; position: relative; box-sizing: border-box; background: #FFFFFF; color: #1F1A1C; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif; overflow: hidden">
  <!-- content layer: opaque -->
  <main style="padding: 84px 24px 140px 24px; display: flex; flex-direction: column; gap: 16px">
    <h1 id="q" style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 700; color: #1F1A1C">When did your last period start?</h1>
    <div role="radiogroup" aria-labelledby="q" style="display: flex; flex-wrap: wrap; gap: 8px">
      <button type="button" role="radio" aria-checked="false" style="min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1.5px solid transparent; background: #F3F3F4; color: #1F1A1C; font-size: 15px; font-weight: 400; font-family: inherit; display: inline-flex; align-items: center; gap: 6px">Today</button>
      <button type="button" role="radio" aria-checked="false" style="min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1.5px solid transparent; background: #F3F3F4; color: #1F1A1C; font-size: 15px; font-weight: 400; font-family: inherit; display: inline-flex; align-items: center; gap: 6px">Yesterday</button>
      <button type="button" role="radio" aria-checked="false" style="min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1.5px solid transparent; background: #F3F3F4; color: #1F1A1C; font-size: 15px; font-weight: 400; font-family: inherit; display: inline-flex; align-items: center; gap: 6px">A week ago</button>
      <button type="button" role="radio" aria-checked="true" style="min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1.5px solid #BC4560; background: #F4DCE0; color: #A3354F; font-size: 15px; font-weight: 600; font-family: inherit; display: inline-flex; align-items: center; gap: 6px"><svg width="12" height="12" viewBox="0 0 14 14" aria-hidden="true"><path d="M2.5 7.5L5.5 10.5L11.5 3.5" fill="none" stroke="#A3354F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>Another date</button>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 6px 6px 6px 20px; box-sizing: border-box; border-radius: 28px; background: #F3F3F4">
        <label for="last-date" style="flex: 1; font-size: 17px; line-height: 22px; color: #1F1A1C">Last period started</label>
        <button id="last-date" type="button" aria-haspopup="dialog" style="min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #E4E4E6; background: #FFFFFF; color: #1F1A1C; font-size: 17px; font-family: inherit; font-variant-numeric: tabular-nums; flex-shrink: 0">31 Oct 2026</button>
      </div>
    <div style="height: 8px"></div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="usual" style="font-size: 13px; line-height: 18px; color: #6B6165">Usual cycle length (optional)</label>
      <input id="usual" type="text" inputmode="numeric" maxlength="2" value="28" aria-describedby="usual-note" style="height: 52px; box-sizing: border-box; border-radius: 26px; padding: 0 20px; border: 1.5px solid transparent; background: #F3F3F4; color: #1F1A1C; font-size: 17px; font-family: inherit; font-variant-numeric: tabular-nums">
      <p id="usual-note" style="margin: 0; font-size: 13px; line-height: 18px; color: #6B6165">Leave blank if unsure</p>
    </div>
  </main>

  <!-- navigation layer: Back and Skip as floating glass controls, the progress dots on a small glass platter (D-095). No tab bar during onboarding. -->
  <header style="position: absolute; top: 10px; left: 10px; right: 10px; height: 44px; display: flex; align-items: center">
    <div style="width: 80px; display: flex; justify-content: flex-start"><button type="button" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: linear-gradient(180deg, rgba(255,255,255,0.50) 0%, rgba(255,255,255,0.22) 42%, rgba(255,255,255,0.30) 100%); backdrop-filter: blur(18px) saturate(200%) brightness(1.04); -webkit-backdrop-filter: blur(18px) saturate(200%) brightness(1.04); border: 1px solid rgba(255,255,255,0.6); box-shadow: 0 1px 2px rgba(31,26,28,0.06), 0 8px 22px rgba(31,26,28,0.14), inset 0 1px 0 rgba(255,255,255,0.95); color: #1F1A1C; font-size: 22px; padding: 0">‹</button></div>
    <div style="flex: 1; display: flex; justify-content: center">
      <div role="img" aria-label="Step 3 of 5" style="height: 30px; padding: 0 12px; border-radius: 15px; background: linear-gradient(180deg, rgba(255,255,255,0.50) 0%, rgba(255,255,255,0.22) 42%, rgba(255,255,255,0.30) 100%); backdrop-filter: blur(18px) saturate(200%) brightness(1.04); -webkit-backdrop-filter: blur(18px) saturate(200%) brightness(1.04); border: 1px solid rgba(255,255,255,0.6); box-shadow: 0 1px 2px rgba(31,26,28,0.06), 0 8px 22px rgba(31,26,28,0.14), inset 0 1px 0 rgba(255,255,255,0.95); display: flex; align-items: center; gap: 7px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #BC4560"></span><span style="width: 8px; height: 8px; border-radius: 4px; background: #BC4560"></span><span style="width: 22px; height: 8px; border-radius: 4px; background: #BC4560"></span><span style="width: 8px; height: 8px; border-radius: 4px; background: rgba(31,26,28,0.2)"></span><span style="width: 8px; height: 8px; border-radius: 4px; background: rgba(31,26,28,0.2)"></span></div>
    </div>
    <div style="width: 80px; display: flex; justify-content: flex-end"><button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 22px; background: linear-gradient(180deg, rgba(255,255,255,0.50) 0%, rgba(255,255,255,0.22) 42%, rgba(255,255,255,0.30) 100%); backdrop-filter: blur(18px) saturate(200%) brightness(1.04); -webkit-backdrop-filter: blur(18px) saturate(200%) brightness(1.04); border: 1px solid rgba(255,255,255,0.6); box-shadow: 0 1px 2px rgba(31,26,28,0.06), 0 8px 22px rgba(31,26,28,0.14), inset 0 1px 0 rgba(255,255,255,0.95); color: #A3354F; font-size: 15px; font-weight: 600">Skip</button></div>
  </header>

  <!-- navigation layer: floating glass footer with the one filled primary -->
  <div style="position: absolute; left: 10px; right: 10px; bottom: 12px; border-radius: 34px; padding: 8px; background: linear-gradient(180deg, rgba(255,255,255,0.50) 0%, rgba(255,255,255,0.22) 42%, rgba(255,255,255,0.30) 100%); backdrop-filter: blur(18px) saturate(200%) brightness(1.04); -webkit-backdrop-filter: blur(18px) saturate(200%) brightness(1.04); border: 1px solid rgba(255,255,255,0.6); box-shadow: 0 1px 2px rgba(31,26,28,0.06), 0 14px 36px rgba(31,26,28,0.18), inset 0 1px 0 rgba(255,255,255,0.95), inset 0 -1px 0 rgba(31,26,28,0.04); display: flex; flex-direction: column; gap: 6px">
    <button type="button" style="min-height: 52px; border-radius: 26px; border: 0; background: rgba(188,69,96,0.96); color: #FFFFFF; box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 6px 16px rgba(188,69,96,0.32); font-size: 17px; font-weight: 600; font-family: inherit">Continue</button>
  </div>
</div>

</body>
</html>
