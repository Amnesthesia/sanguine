<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log sheet: More expanded (sex logging on)</title>
<style>
body{margin:0}
a{color:#A3354F}a:hover{color:#BC4560}
textarea::placeholder{color:#6B6165}
</style>
</head>
<body>


<div style="width: 390px; height: 1960px; position: relative; box-sizing: border-box; background: #8E8387; color: #1F1A1C; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif; overflow: hidden">
  <!-- the screen behind, dimmed while the sheet is open -->
  <div aria-hidden="true" style="height: 52px; background: linear-gradient(#F4EEEF, #D8CFD2)"></div>

  <!-- navigation layer: the log sheet at its large detent. The cards inside it are opaque content. -->
  <section role="dialog" aria-label="Log, Monday 2 November, today" style="position: absolute; top: 40px; left: 0; right: 0; bottom: 0; border-radius: 34px 34px 0 0; background: rgba(255,255,255,0.97); backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%); box-shadow: 0 -6px 30px rgba(31,26,28,0.22), inset 0 1px 0 rgba(255,255,255,0.95); overflow: hidden">

    <div style="padding: 70px 16px 40px 16px; display: flex; flex-direction: column; gap: 16px">

      <!-- shown scrolled: the energy card sits under the glass header -->
      <section aria-labelledby="h-energy" style="border-radius: 24px; background: #FFFFFF; box-shadow: 0 0 0 1px rgba(31,26,28,0.04), 0 2px 6px rgba(31,26,28,0.04), 0 12px 32px rgba(31,26,28,0.08); padding: 16px; display: flex; flex-direction: column; gap: 12px">
        <h2 id="h-energy" style="margin: 0; font-size: 17px; font-weight: 600">Energy</h2>
        <!-- energy: a five-step slider (owner). Unset shows no thumb; Clear removes the value. --><div style="display: flex; flex-direction: column; gap: 6px"><div style="display: flex; align-items: center; justify-content: space-between; min-height: 32px"><span style="font-size: 15px; font-weight: 600; color: #A3354F">Low</span><button type="button" style="min-height: 32px; padding: 0 12px; border-radius: 16px; border: 0; background: #F3F3F4; color: #4A4246; font: inherit; font-size: 13px">Clear</button></div><div role="slider" tabindex="0" aria-labelledby="h-energy" aria-valuemin="1" aria-valuemax="5" aria-valuenow="2" aria-valuetext="Low" style="position: relative; height: 44px; cursor: pointer"><span style="position: absolute; top: 16px; left: 8px; right: 8px; height: 12px; border-radius: 6px; background: #F3F3F4; box-shadow: inset 0 0 0 1px #E4E4E6"></span><span style="position: absolute; top: 16px; left: 8px; width: calc(calc(14px + (100% - 28px) * 0.25) - 8px + 6px); height: 12px; border-radius: 6px; background: linear-gradient(90deg, #E9B7C2, #C9667D)"></span><span style="position: absolute; top: 19px; left: calc(14px + (100% - 28px) * 0.00); margin-left: -3px; width: 6px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.9)"></span><span style="position: absolute; top: 19px; left: calc(14px + (100% - 28px) * 0.25); margin-left: -3px; width: 6px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.9)"></span><span style="position: absolute; top: 19px; left: calc(14px + (100% - 28px) * 0.50); margin-left: -3px; width: 6px; height: 6px; border-radius: 3px; background: #CFC6CA"></span><span style="position: absolute; top: 19px; left: calc(14px + (100% - 28px) * 0.75); margin-left: -3px; width: 6px; height: 6px; border-radius: 3px; background: #CFC6CA"></span><span style="position: absolute; top: 19px; left: calc(14px + (100% - 28px) * 1.00); margin-left: -3px; width: 6px; height: 6px; border-radius: 3px; background: #CFC6CA"></span><span style="position: absolute; top: 8px; left: calc(14px + (100% - 28px) * 0.25); margin-left: -14px; width: 28px; height: 28px; border-radius: 14px; background: #FFFFFF; box-shadow: 0 0 0 0.5px rgba(31,26,28,0.12), 0 3px 8px rgba(31,26,28,0.22)"></span></div><div aria-hidden="true" style="position: relative; height: 16px"><span style="position: absolute; left: calc(14px + (100% - 28px) * 0.00); transform: translateX(-50%); white-space: nowrap; font-size: 11px; color: #6B6165">Very low</span><span style="position: absolute; left: calc(14px + (100% - 28px) * 0.25); transform: translateX(-50%); white-space: nowrap; font-size: 11px; font-weight: 700; color: #A3354F">Low</span><span style="position: absolute; left: calc(14px + (100% - 28px) * 0.50); transform: translateX(-50%); white-space: nowrap; font-size: 11px; color: #6B6165">OK</span><span style="position: absolute; left: calc(14px + (100% - 28px) * 0.75); transform: translateX(-50%); white-space: nowrap; font-size: 11px; color: #6B6165">Good</span><span style="position: absolute; left: calc(14px + (100% - 28px) * 1.00); transform: translateX(-50%); white-space: nowrap; font-size: 11px; color: #6B6165">High</span></div></div>
      </section>

      <!-- More with every row open, for review. In use one row opens at a time; a choice saves at once and closes the row,
           typed values save with the row's own Save (a secondary pill, so Done stays the sheet's one filled control).
           Rows: Sex only when turned on in Settings (off by default); teen mode hides Ovulation test, Cervical mucus and Cervical position. -->
      <section aria-labelledby="h-more" style="border-radius: 24px; background: #FFFFFF; box-shadow: 0 0 0 1px rgba(31,26,28,0.04), 0 2px 6px rgba(31,26,28,0.04), 0 12px 32px rgba(31,26,28,0.08); padding: 16px 16px 4px 16px; display: flex; flex-direction: column">
        <h2 id="h-more" style="margin: 0 0 8px 0; font-size: 17px; font-weight: 600">More</h2>

        <button type="button" aria-expanded="true" aria-label="Temperature. Add" style="width: 100%; min-height: 52px; padding: 0; border: 0; border-top: 1px solid #E4E4E6; background: none; font: inherit; font-size: 15px; color: #1F1A1C; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left"><span style="font-weight: 600">Temperature</span><span style="display: flex; align-items: center; gap: 10px; color: #A3354F">Add<svg width="12" height="8" viewBox="0 0 12 8" aria-hidden="true"><path d="M1 6.5L6 1.5L11 6.5" fill="none" stroke="#6B6165" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></span></button>
        <div style="display: flex; flex-direction: column; gap: 12px; padding: 4px 0 16px 0">
          <div style="display: flex; gap: 10px">
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #4A4246; flex: 1">Temperature (°C)<input type="text" inputmode="decimal" value="36.42" style="height: 52px; box-sizing: border-box; border-radius: 26px; background: #F3F3F4; padding: 0 18px; font: inherit; font-size: 17px; font-weight: 400; color: #1F1A1C; border: 1.5px solid transparent"></label>
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #4A4246; width: 112px">Time (24 h)<input type="text" value="6.40" aria-invalid="true" aria-describedby="time-err" style="height: 52px; box-sizing: border-box; border-radius: 26px; background: #F3F3F4; padding: 0 18px; font: inherit; font-size: 17px; font-weight: 400; color: #1F1A1C; border: 1.5px solid #B9741E"></label>
          </div>
          <span style="font-size: 12px; line-height: 17px; color: #4A4246">Filled in with your last temperature. The unit is set in Settings.</span>
          <span id="time-err" role="alert" style="display: flex; gap: 6px; align-items: center; font-size: 13px; line-height: 18px; color: #8A5512"><svg width="14" height="14" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="5" fill="none" stroke="#8A5512" stroke-width="1.3"></circle><path d="M6 3.3V6.6M6 8.4V8.6" stroke="#8A5512" stroke-width="1.4" stroke-linecap="round"></path></svg>Enter a time like 06:40.</span>
          <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.4px; color: #4A4246">SOURCE</span>
          <div role="radiogroup" aria-label="Source" style="display: flex; flex-wrap: wrap; gap: 8px"><button type="button" role="radio" aria-checked="true" style="min-height: 44px; padding: 0 16px; border-radius: 22px; font: inherit; font-size: 14px; border: 1.5px solid #BC4560; background: #F4DCE0; color: #A3354F; font-weight: 600">Oral</button><button type="button" role="radio" aria-checked="false" style="min-height: 44px; padding: 0 16px; border-radius: 22px; font: inherit; font-size: 14px; border: 1.5px solid transparent; background: #F3F3F4; color: #1F1A1C">Vaginal</button><button type="button" role="radio" aria-checked="false" style="min-height: 44px; padding: 0 16px; border-radius: 22px; font: inherit; font-size: 14px; border: 1.5px solid transparent; background: #F3F3F4; color: #1F1A1C">Wrist</button><button type="button" role="radio" aria-checked="false" style="min-height: 44px; padding: 0 16px; border-radius: 22px; font: inherit; font-size: 14px; border: 1.5px solid transparent; background: #F3F3F4; color: #1F1A1C">Finger</button><button type="button" role="radio" aria-checked="false" style="min-height: 44px; padding: 0 16px; border-radius: 22px; font: inherit; font-size: 14px; border: 1.5px solid transparent; background: #F3F3F4; color: #1F1A1C">Other</button></div>
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px">
            <span id="dist" style="font-size: 15px; line-height: 20px">Disturbed (illness, alcohol, little sleep)</span>
            <button type="button" role="switch" aria-checked="false" aria-labelledby="dist" style="width: 51px; height: 31px; flex-shrink: 0; border-radius: 16px; border: 0; padding: 2px; background: #E4E4E6; display: flex; align-items: center"><span style="width: 27px; height: 27px; border-radius: 14px; background: #FFFFFF; box-shadow: 0 2px 4px rgba(31,26,28,0.2)"></span></button>
          </div>
          <button type="button" style="align-self: flex-start; min-height: 44px; padding: 0 22px; border-radius: 22px; background: #FFFFFF; box-shadow: 0 0 0 1px rgba(31,26,28,0.04), 0 2px 6px rgba(31,26,28,0.04), 0 12px 32px rgba(31,26,28,0.08); color: #1F1A1C; font-size: 15px; font-weight: 600">Save</button>
        </div>

        <button type="button" aria-expanded="true" aria-label="Ovulation test. Positive" style="width: 100%; min-height: 52px; padding: 0; border: 0; border-top: 1px solid #E4E4E6; background: none; font: inherit; font-size: 15px; color: #1F1A1C; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left"><span style="font-weight: 600">Ovulation test</span><span style="display: flex; align-items: center; gap: 10px; color: #1F1A1C">Positive<svg width="12" height="8" viewBox="0 0 12 8" aria-hidden="true"><path d="M1 6.5L6 1.5L11 6.5" fill="none" stroke="#6B6165" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></span></button>
        <div style="display: flex; flex-direction: column; gap: 12px; padding: 4px 0 16px 0">
          <div role="radiogroup" aria-label="Ovulation test" style="display: flex; flex-wrap: wrap; gap: 8px"><button type="button" role="radio" aria-checked="false" style="min-height: 44px; padding: 0 16px; border-radius: 22px; font: inherit; font-size: 14px; border: 1.5px solid transparent; background: #F3F3F4; color: #1F1A1C">Negative</button><button type="button" role="radio" aria-checked="true" style="min-height: 44px; padding: 0 16px; border-radius: 22px; font: inherit; font-size: 14px; border: 1.5px solid #BC4560; background: #F4DCE0; color: #A3354F; font-weight: 600">Positive</button><button type="button" role="radio" aria-checked="false" style="min-height: 44px; padding: 0 16px; border-radius: 22px; font: inherit; font-size: 14px; border: 1.5px solid transparent; background: #F3F3F4; color: #1F1A1C">High</button><button type="button" role="radio" aria-checked="false" style="min-height: 44px; padding: 0 16px; border-radius: 22px; font: inherit; font-size: 14px; border: 1.5px solid transparent; background: #F3F3F4; color: #1F1A1C">Peak</button><button type="button" role="radio" aria-checked="false" style="min-height: 44px; padding: 0 16px; border-radius: 22px; font: inherit; font-size: 14px; border: 1.5px solid transparent; background: #F3F3F4; color: #1F1A1C">Unclear</button></div>
        </div>

        <button type="button" aria-expanded="true" aria-label="Cervical mucus. Add" style="width: 100%; min-height: 52px; padding: 0; border: 0; border-top: 1px solid #E4E4E6; background: none; font: inherit; font-size: 15px; color: #1F1A1C; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left"><span style="font-weight: 600">Cervical mucus</span><span style="display: flex; align-items: center; gap: 10px; color: #A3354F">Add<svg width="12" height="8" viewBox="0 0 12 8" aria-hidden="true"><path d="M1 6.5L6 1.5L11 6.5" fill="none" stroke="#6B6165" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></span></button>
        <div style="display: flex; flex-direction: column; gap: 12px; padding: 4px 0 16px 0">
          <div role="radiogroup" aria-label="Cervical mucus" style="display: flex; flex-wrap: wrap; gap: 8px"><button type="button" role="radio" aria-checked="false" style="min-height: 44px; padding: 0 16px; border-radius: 22px; font: inherit; font-size: 14px; border: 1.5px solid transparent; background: #F3F3F4; color: #1F1A1C">Dry</button><button type="button" role="radio" aria-checked="false" style="min-height: 44px; padding: 0 16px; border-radius: 22px; font: inherit; font-size: 14px; border: 1.5px solid transparent; background: #F3F3F4; color: #1F1A1C">Sticky</button><button type="button" role="radio" aria-checked="false" style="min-height: 44px; padding: 0 16px; border-radius: 22px; font: inherit; font-size: 14px; border: 1.5px solid transparent; background: #F3F3F4; color: #1F1A1C">Creamy</button><button type="button" role="radio" aria-checked="false" style="min-height: 44px; padding: 0 16px; border-radius: 22px; font: inherit; font-size: 14px; border: 1.5px solid transparent; background: #F3F3F4; color: #1F1A1C">Watery</button><button type="button" role="radio" aria-checked="false" style="min-height: 44px; padding: 0 16px; border-radius: 22px; font: inherit; font-size: 14px; border: 1.5px solid transparent; background: #F3F3F4; color: #1F1A1C">Egg white</button></div>
        </div>

        <button type="button" aria-expanded="true" aria-label="Sex. Add" style="width: 100%; min-height: 52px; padding: 0; border: 0; border-top: 1px solid #E4E4E6; background: none; font: inherit; font-size: 15px; color: #1F1A1C; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left"><span style="font-weight: 600">Sex</span><span style="display: flex; align-items: center; gap: 10px; color: #A3354F">Add<svg width="12" height="8" viewBox="0 0 12 8" aria-hidden="true"><path d="M1 6.5L6 1.5L11 6.5" fill="none" stroke="#6B6165" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></span></button>
        <div style="display: flex; flex-direction: column; gap: 12px; padding: 4px 0 16px 0">
          <div role="radiogroup" aria-label="Sex" style="display: flex; flex-wrap: wrap; gap: 8px"><button type="button" role="radio" aria-checked="false" style="min-height: 44px; padding: 0 16px; border-radius: 22px; font: inherit; font-size: 14px; border: 1.5px solid transparent; background: #F3F3F4; color: #1F1A1C">Condom used</button><button type="button" role="radio" aria-checked="false" style="min-height: 44px; padding: 0 16px; border-radius: 22px; font: inherit; font-size: 14px; border: 1.5px solid transparent; background: #F3F3F4; color: #1F1A1C">No condom</button></div>
        </div>

        <button type="button" aria-expanded="true" aria-label="Note. Add" style="width: 100%; min-height: 52px; padding: 0; border: 0; border-top: 1px solid #E4E4E6; background: none; font: inherit; font-size: 15px; color: #1F1A1C; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left"><span style="font-weight: 600">Note</span><span style="display: flex; align-items: center; gap: 10px; color: #A3354F">Add<svg width="12" height="8" viewBox="0 0 12 8" aria-hidden="true"><path d="M1 6.5L6 1.5L11 6.5" fill="none" stroke="#6B6165" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></span></button>
        <div style="display: flex; flex-direction: column; gap: 12px; padding: 4px 0 16px 0">
          <textarea aria-label="Note" aria-describedby="note-lock" placeholder="Add a private note" style="min-height: 96px; box-sizing: border-box; border-radius: 24px; border: 1.5px solid transparent; background: #F3F3F4; padding: 14px 18px; font: inherit; font-size: 16px; line-height: 21px; color: #1F1A1C; resize: none"></textarea>
          <span id="note-lock" style="display: flex; gap: 6px; align-items: center; font-size: 13px; line-height: 18px; color: #6B6165"><svg width="12" height="14" viewBox="0 0 12 14" aria-hidden="true"><rect x="1.5" y="6" width="9" height="7" rx="2" fill="none" stroke="#6B6165" stroke-width="1.3"></rect><path d="M3.5 6V4.2A2.5 2.5 0 0 1 8.5 4.2V6" fill="none" stroke="#6B6165" stroke-width="1.3"></path></svg>Notes are private to this phone.</span>
          <button type="button" disabled="" aria-disabled="true" style="align-self: flex-start; min-height: 44px; padding: 0 22px; border-radius: 22px; background: #FFFFFF; box-shadow: 0 0 0 1px rgba(31,26,28,0.04), 0 2px 6px rgba(31,26,28,0.04), 0 12px 32px rgba(31,26,28,0.08); color: #1F1A1C; font-size: 15px; font-weight: 600; opacity: 0.45">Save</button>
        </div>

        <button type="button" aria-expanded="true" aria-label="Cervical position. Add" style="width: 100%; min-height: 52px; padding: 0; border: 0; border-top: 1px solid #E4E4E6; background: none; font: inherit; font-size: 15px; color: #1F1A1C; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left"><span style="font-weight: 600">Cervical position</span><span style="display: flex; align-items: center; gap: 10px; color: #A3354F">Add<svg width="12" height="8" viewBox="0 0 12 8" aria-hidden="true"><path d="M1 6.5L6 1.5L11 6.5" fill="none" stroke="#6B6165" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></span></button>
        <div style="display: flex; flex-direction: column; gap: 12px; padding: 4px 0 16px 0">
          <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.4px; color: #4A4246">POSITION</span>
          <div role="radiogroup" aria-label="Position" style="display: flex; flex-wrap: wrap; gap: 8px"><button type="button" role="radio" aria-checked="false" style="min-height: 44px; padding: 0 16px; border-radius: 22px; font: inherit; font-size: 14px; border: 1.5px solid transparent; background: #F3F3F4; color: #1F1A1C">Low</button><button type="button" role="radio" aria-checked="true" style="min-height: 44px; padding: 0 16px; border-radius: 22px; font: inherit; font-size: 14px; border: 1.5px solid #BC4560; background: #F4DCE0; color: #A3354F; font-weight: 600">Mid</button><button type="button" role="radio" aria-checked="false" style="min-height: 44px; padding: 0 16px; border-radius: 22px; font: inherit; font-size: 14px; border: 1.5px solid transparent; background: #F3F3F4; color: #1F1A1C">High</button></div>
          <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.4px; color: #4A4246">FIRMNESS</span>
          <div role="radiogroup" aria-label="Firmness" style="display: flex; flex-wrap: wrap; gap: 8px"><button type="button" role="radio" aria-checked="false" style="min-height: 44px; padding: 0 16px; border-radius: 22px; font: inherit; font-size: 14px; border: 1.5px solid transparent; background: #F3F3F4; color: #1F1A1C">Firm</button><button type="button" role="radio" aria-checked="true" style="min-height: 44px; padding: 0 16px; border-radius: 22px; font: inherit; font-size: 14px; border: 1.5px solid #BC4560; background: #F4DCE0; color: #A3354F; font-weight: 600">Medium</button><button type="button" role="radio" aria-checked="false" style="min-height: 44px; padding: 0 16px; border-radius: 22px; font: inherit; font-size: 14px; border: 1.5px solid transparent; background: #F3F3F4; color: #1F1A1C">Soft</button></div>
          <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.4px; color: #4A4246">OPENING</span>
          <div role="radiogroup" aria-label="Opening" style="display: flex; flex-wrap: wrap; gap: 8px"><button type="button" role="radio" aria-checked="false" style="min-height: 44px; padding: 0 16px; border-radius: 22px; font: inherit; font-size: 14px; border: 1.5px solid transparent; background: #F3F3F4; color: #1F1A1C">Closed</button><button type="button" role="radio" aria-checked="true" style="min-height: 44px; padding: 0 16px; border-radius: 22px; font: inherit; font-size: 14px; border: 1.5px solid #BC4560; background: #F4DCE0; color: #A3354F; font-weight: 600">Partly open</button><button type="button" role="radio" aria-checked="false" style="min-height: 44px; padding: 0 16px; border-radius: 22px; font: inherit; font-size: 14px; border: 1.5px solid transparent; background: #F3F3F4; color: #1F1A1C">Open</button></div>
          <button type="button" style="align-self: flex-start; min-height: 44px; padding: 0 22px; border-radius: 22px; background: #FFFFFF; box-shadow: 0 0 0 1px rgba(31,26,28,0.04), 0 2px 6px rgba(31,26,28,0.04), 0 12px 32px rgba(31,26,28,0.08); color: #1F1A1C; font-size: 15px; font-weight: 600">Save</button>
        </div>
      </section>
    </div>

    <!-- glass sheet header: grabber, previous and next day, date, and Done (the sheet's one filled control; it only closes, writes are already saved) -->
    <div style="position: absolute; top: 0; left: 0; right: 0; padding: 0 10px; display: flex; flex-direction: column; align-items: center">
      <button type="button" aria-label="Close log sheet" style="width: 60px; height: 20px; border: 0; background: none; display: flex; align-items: center; justify-content: center; padding: 0"><span style="width: 36px; height: 5px; border-radius: 3px; background: rgba(31,26,28,0.22)"></span></button>
      <header style="align-self: stretch; border-radius: 30px; padding: 8px; background: linear-gradient(180deg, rgba(255,255,255,0.50) 0%, rgba(255,255,255,0.22) 42%, rgba(255,255,255,0.30) 100%); backdrop-filter: blur(18px) saturate(200%) brightness(1.04); -webkit-backdrop-filter: blur(18px) saturate(200%) brightness(1.04); border: 1px solid rgba(255,255,255,0.6); box-shadow: 0 10px 30px rgba(31,26,28,0.14), inset 0 1px 0 rgba(255,255,255,0.95), inset 0 -1px 0 rgba(255,255,255,0.35); display: flex; align-items: center; gap: 6px">
        <button type="button" aria-label="Previous day" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: 1px solid rgba(255,255,255,0.6); background: rgba(255,255,255,0.5); box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 2px 6px rgba(31,26,28,0.08); color: #1F1A1C; font-size: 22px">‹</button>
        <h1 style="margin: 0; flex: 1; min-width: 0; text-align: center; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 17px; line-height: 22px; font-weight: 600">Monday 2 November</span><span style="font-size: 12px; line-height: 16px; font-weight: 400; color: #4A4246">Today · Day 3 · Saved</span></h1>
        <button type="button" aria-label="Next day" aria-disabled="true" disabled="" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: 1px solid rgba(255,255,255,0.6); background: rgba(255,255,255,0.5); color: #1F1A1C; font-size: 22px; opacity: 0.35">›</button>
        <button type="button" style="min-height: 44px; flex-shrink: 0; padding: 0 18px; border-radius: 22px; border: 0; background: rgba(188,69,96,0.96); color: #FFFFFF; font-size: 17px; font-weight: 600; box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 3px 10px rgba(188,69,96,0.3)">Done</button>
      </header>
    </div>
  </section>
</div>
