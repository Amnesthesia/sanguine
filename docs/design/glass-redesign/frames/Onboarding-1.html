<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onboarding step 1: purpose</title>
<style>
body{margin:0}
a{color:#BC4560}a:hover{color:#A3354F}
</style>
</head>
<body>


<div style="width: 390px; height: 844px; position: relative; box-sizing: border-box; background: #FFFFFF; color: #1F1A1C; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif; overflow: hidden">
  <!-- content layer: opaque -->
  <main style="padding: 84px 24px 140px 24px; display: flex; flex-direction: column; gap: 16px">
    <h1 id="q" style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 700; color: #1F1A1C">Track and understand your cycle</h1>
    <p style="margin: 0; font-size: 16px; line-height: 24px; color: #1F1A1C">Sanguine estimates when your next period and your ovulation are likely, using what you log. Estimates are ranges, not promises. Sanguine is not a contraceptive and is not a medical device.</p>
  </main>

  <!-- navigation layer: Back and Skip as floating glass controls, the progress dots on a small glass platter (D-095). No tab bar during onboarding. -->
  <header style="position: absolute; top: 10px; left: 10px; right: 10px; height: 44px; display: flex; align-items: center">
    <div style="width: 80px; display: flex; justify-content: flex-start"></div>
    <div style="flex: 1; display: flex; justify-content: center">
      <div role="img" aria-label="Step 1 of 5" style="height: 30px; padding: 0 12px; border-radius: 15px; background: linear-gradient(180deg, rgba(255,255,255,0.50) 0%, rgba(255,255,255,0.22) 42%, rgba(255,255,255,0.30) 100%); backdrop-filter: blur(18px) saturate(200%) brightness(1.04); -webkit-backdrop-filter: blur(18px) saturate(200%) brightness(1.04); border: 1px solid rgba(255,255,255,0.6); box-shadow: 0 1px 2px rgba(31,26,28,0.06), 0 8px 22px rgba(31,26,28,0.14), inset 0 1px 0 rgba(255,255,255,0.95); display: flex; align-items: center; gap: 7px"><span style="width: 22px; height: 8px; border-radius: 4px; background: #BC4560"></span><span style="width: 8px; height: 8px; border-radius: 4px; background: rgba(31,26,28,0.2)"></span><span style="width: 8px; height: 8px; border-radius: 4px; background: rgba(31,26,28,0.2)"></span><span style="width: 8px; height: 8px; border-radius: 4px; background: rgba(31,26,28,0.2)"></span><span style="width: 8px; height: 8px; border-radius: 4px; background: rgba(31,26,28,0.2)"></span></div>
    </div>
    <div style="width: 80px; display: flex; justify-content: flex-end"></div>
  </header>

  <!-- navigation layer: floating glass footer with the one filled primary -->
  <div style="position: absolute; left: 10px; right: 10px; bottom: 12px; border-radius: 34px; padding: 8px; background: linear-gradient(180deg, rgba(255,255,255,0.50) 0%, rgba(255,255,255,0.22) 42%, rgba(255,255,255,0.30) 100%); backdrop-filter: blur(18px) saturate(200%) brightness(1.04); -webkit-backdrop-filter: blur(18px) saturate(200%) brightness(1.04); border: 1px solid rgba(255,255,255,0.6); box-shadow: 0 1px 2px rgba(31,26,28,0.06), 0 14px 36px rgba(31,26,28,0.18), inset 0 1px 0 rgba(255,255,255,0.95), inset 0 -1px 0 rgba(31,26,28,0.04); display: flex; flex-direction: column; gap: 6px">
    <button type="button" style="min-height: 52px; border-radius: 26px; border: 0; background: rgba(188,69,96,0.96); color: #FFFFFF; box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 6px 16px rgba(188,69,96,0.32); font-size: 17px; font-weight: 600; font-family: inherit">Continue</button>
  </div>
</div>

</body>
</html>
