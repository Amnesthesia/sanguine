<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings: Encrypted backup, restore (after a wrong passphrase)</title>
<style>
body{margin:0}
a{color:#A3354F}a:hover{color:#BC4560}
</style>
</head>
<body>


<div style="width: 390px; height: 844px; position: relative; box-sizing: border-box; background: #FFFFFF; color: #1F1A1C; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif; overflow: hidden">
  <!-- content layer: opaque; shown scrolled a little, so the first card sits under the glass toolbar -->
  <main style="padding: 130px 16px 40px 16px; display: flex; flex-direction: column; gap: 16px">
    <p style="margin: 0 4px; font-size: 15px; line-height: 21px; color: #6B6165">Keep the passphrase and recovery code somewhere private. Without them the backup cannot be opened, by design.</p>
    <div role="status" aria-live="polite" style="border-radius: 18px; background: rgba(185,116,30,0.10); padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><circle cx="9" cy="9" r="7.5" fill="none" stroke="#8A5512" stroke-width="1.5"></circle><path d="M9 5.2V9.8M9 12.4V12.6" stroke="#8A5512" stroke-width="1.7" stroke-linecap="round"></path></svg><span style="flex: 1; display: flex; flex-direction: column; gap: 10px"><span style="font-size: 14px; line-height: 20px; color: #5E3A0C">That passphrase or recovery code does not open this backup.</span></span></div>
    <label for="pass" style="display: flex; flex-direction: column; gap: 6px; margin: 0"><span style="margin: 0 4px; font-size: 13px; line-height: 18px; color: #6B6165">Backup passphrase</span><input id="pass" type="password" value="tidepool-lantern" autocomplete="off" autocapitalize="none" spellcheck="false" style="min-height: 52px; box-sizing: border-box; width: 100%; border-radius: 18px; border: 1.5px solid transparent; background: #FFFFFF; box-shadow: 0 0 0 1px rgba(31,26,28,0.07), 0 1px 3px rgba(31,26,28,0.05); padding: 0 16px; font-size: 17px; font-family: inherit; color: #1F1A1C"></label>
    <label for="code" style="display: flex; flex-direction: column; gap: 6px; margin: 0"><span style="margin: 0 4px; font-size: 13px; line-height: 18px; color: #6B6165">Recovery code (needed on a new phone)</span><input id="code" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" style="min-height: 52px; box-sizing: border-box; width: 100%; border-radius: 18px; border: 1.5px solid transparent; background: #FFFFFF; box-shadow: 0 0 0 1px rgba(31,26,28,0.07), 0 1px 3px rgba(31,26,28,0.05); padding: 0 16px; font-size: 17px; font-family: inherit; color: #1F1A1C"></label>
    <button type="button" style="width: 100%; min-height: 52px; border-radius: 26px; border: 0; background: rgba(188,69,96,0.96); color: #FFFFFF; font-size: 17px; font-weight: 600; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 6px 16px rgba(188,69,96,0.32)"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M2.5 5.5A1.5 1.5 0 0 1 4 4H7.2L8.8 5.8H14A1.5 1.5 0 0 1 15.5 7.3V13A1.5 1.5 0 0 1 14 14.5H4A1.5 1.5 0 0 1 2.5 13Z" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linejoin="round"></path></svg>Choose backup file</button>
    <button type="button" style="min-height: 48px; padding: 0 20px; border-radius: 24px; background: #FFFFFF; box-shadow: 0 0 0 1px rgba(31,26,28,0.04), 0 2px 6px rgba(31,26,28,0.04), 0 12px 32px rgba(31,26,28,0.08); color: #1F1A1C; font-size: 15px; font-weight: 500; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px">Restore from iCloud Drive</button>
    <p style="margin: 0 4px; font-size: 13px; line-height: 18px; color: #6B6165">Last upload 2/11/2026, 7:58:12 am</p>
  </main>
  <!-- navigation layer: glass toolbar (D-096): round back button, centred title -->
  <header style="position: absolute; top: 10px; left: 10px; right: 10px; border-radius: 30px; padding: 8px; background: linear-gradient(180deg, rgba(255,255,255,0.50) 0%, rgba(255,255,255,0.22) 42%, rgba(255,255,255,0.30) 100%); backdrop-filter: blur(18px) saturate(200%) brightness(1.04); -webkit-backdrop-filter: blur(18px) saturate(200%) brightness(1.04); border: 1px solid rgba(255,255,255,0.6); box-shadow: 0 10px 30px rgba(31,26,28,0.14), inset 0 1px 0 rgba(255,255,255,0.95), inset 0 -1px 0 rgba(255,255,255,0.35); display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; align-items: center; gap: 6px">
      <button type="button" aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: 1px solid rgba(255,255,255,0.6); background: rgba(255,255,255,0.5); box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 2px 6px rgba(31,26,28,0.08); color: #1F1A1C; font-size: 22px; padding: 0">‹</button>
      <h1 style="margin: 0; flex: 1; text-align: center; font-size: 17px; line-height: 22px; font-weight: 600">Encrypted backup</h1>
      <span aria-hidden="true" style="width: 44px; flex-shrink: 0"></span>
    </div>
    <div role="radiogroup" aria-label="Back up or restore" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 3px; border-radius: 23px; background: rgba(31,26,28,0.07)"><button type="button" role="radio" aria-checked="false" style="min-height: 40px; border-radius: 20px; border: 0; color: #1F1A1C; font-size: 15px; font-family: inherit; background: transparent; font-weight: 500">Back up</button><button type="button" role="radio" aria-checked="true" style="min-height: 40px; border-radius: 20px; border: 0; color: #1F1A1C; font-size: 15px; font-family: inherit; background: #FFFFFF; box-shadow: 0 1px 3px rgba(31,26,28,0.14), 0 0 0 0.5px rgba(31,26,28,0.04); font-weight: 600">Restore</button></div>
  </header>
</div>

</body>
</html>
