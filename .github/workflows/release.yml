# Store release (PLAN.md §6.6). Builds run on a version tag; submission is a manual dispatch.
# Owner-supplied: the EXPO_TOKEN secret, App Store Connect and Play credentials registered with EAS.
# Over-the-air updates are deliberately absent: engine parameters ship only as versioned builds.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      submit:
        description: 'Submit the latest production builds to TestFlight and the Play internal track'
        type: boolean
        default: false
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version-file: .tool-versions, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
  build:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version-file: .tool-versions, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: npx eas-cli build --non-interactive --no-wait --profile production --platform all
        working-directory: apps/mobile
        env: { EXPO_TOKEN: '${{ secrets.EXPO_TOKEN }}' }
  submit:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.submit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version-file: .tool-versions, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: npx eas-cli submit --non-interactive --profile production --platform all --latest
        working-directory: apps/mobile
        env: { EXPO_TOKEN: '${{ secrets.EXPO_TOKEN }}' }
